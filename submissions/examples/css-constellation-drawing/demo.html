<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS-only constellation drawing animation">
  <title>CSS Constellation Drawing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <h1>CSS Constellation Drawing</h1>
    <p class="description">
      Hover over the constellation to reveal the connected stars.
    </p>

    <section
      class="constellation"
      aria-label="Interactive constellation animation"
      tabindex="0"
    >
      <span class="star star-1"></span>
      <span class="star star-2"></span>
      <span class="star star-3"></span>
      <span class="star star-4"></span>
      <span class="star star-5"></span>
      <span class="star star-6"></span>
      <span class="star star-7"></span>

      <span class="line line-1"></span>
      <span class="line line-2"></span>
      <span class="line line-3"></span>
      <span class="line line-4"></span>
      <span class="line line-5"></span>
      <span class="line line-6"></span>
    </section>
  </main>
</body>
</html>
