<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pure CSS Gradient Shimmer particle effect">
  <title>Gradient Shimmer Particle Effect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="particle-scene" aria-label="Gradient Shimmer particle effect">
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
    <div class="particle particle-5"></div>
    <div class="particle particle-6"></div>
    <div class="particle particle-7"></div>
    <div class="particle particle-8"></div>
    <div class="particle particle-9"></div>
    <div class="particle particle-10"></div>

    <section class="content">
      <span class="label">CSS Particle Effect</span>
      <h1>Gradient Shimmer</h1>
      <p>
        A smooth animated particle field created entirely
        with HTML and Vanilla CSS.
      </p>
    </section>
  </main>
</body>
</html>
